<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Find your team · 20941</title>
<link rel="stylesheet" href="style.css">
<style>
  .find{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--rule);
        background:var(--card);color:var(--ink);border-radius:0}
  .find:focus{outline:none;border-color:var(--blue)}
  .hit{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .hit b{font-family:var(--mono);font-size:44px;line-height:1;color:var(--blue);min-width:1.6em;text-align:right}
  .hit span{font-size:17px}
  .hit small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
             text-transform:uppercase;color:var(--faint);margin-top:2px}
  .msg{color:var(--faint);font-size:15px;padding:18px 0}
  .pick{display:flex;gap:8px;margin:14px 0 18px}
  .pick button{flex:1;font:inherit;font-family:var(--mono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;padding:11px 0;background:var(--card);border:2px solid var(--rule);
    color:var(--ink);cursor:pointer}
  .pick button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body><div class="wrap">
<div class="eyebrow">Persuasive Presentations · 20941</div>
<h1>Find your team</h1>
<p>Type your surname. Then look at the screen for where that team is sitting.</p>

<div class="pick" id="pick">
  <button data-c="fin" aria-pressed="true">Finance · cl. 44</button>
  <button data-c="afm" aria-pressed="false">AFM · cl. 41</button>
</div>

<input class="find" id="q" type="search" autocomplete="off" autocapitalize="off"
       placeholder="Your surname" aria-label="Your surname">
<div id="out" class="msg">Loading the lists…</div>

<p class="note">Nine teams per class. You did not choose them, and they do not change if people are missing.</p>
</div>
<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzMqKFcjnvkifQkto1nDnXd3naMoFKoXxsPnSCK_W5zbtz2nIDAETfoTR7NQfnaM-vaNQ/exec';
(function () {
  var out = document.getElementById('out'), q = document.getElementById('q');
  var cls = 'fin', people = null;

  document.getElementById('pick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cls = b.getAttribute('data-c');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });

  /* Los nombres NO están en este archivo: se piden a la hoja, que es privada.
     Este repositorio es público y no puede contener el listado. */
  fetch(ENDPOINT + '?slot=teams')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok || !d.rows || d.rows.length < 2) throw 0;
      var h = d.rows[0].map(function (x) { return String(x).toLowerCase(); });
      var ni = h.indexOf('name'), ti = h.indexOf('team'), ci = h.indexOf('class');
      people = d.rows.slice(1).map(function (r) {
        return { name: String(r[ni] || '').trim(),
                 team: String(r[ti] || '').trim(),
                 cls:  ci >= 0 ? String(r[ci] || '').trim().toLowerCase() : '' };
      }).filter(function (p) { return p.name; });
      render();
    })
    .catch(function () {
      out.className = 'msg';
      out.textContent = 'Could not load the lists. Ask, and we will tell you your number.';
    });

  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function render() {
    if (!people) return;
    var term = norm(q.value.trim());
    if (term.length < 2) {
      out.className = 'msg';
      out.textContent = 'Type at least two letters of your surname.';
      return;
    }
    var hits = people.filter(function (p) {
      return p.cls === cls && norm(p.name).indexOf(term) > -1;
    });
    if (!hits.length) {
      out.className = 'msg';
      out.textContent = 'Nothing in ' + cls.toUpperCase() + '. Check the other class, or ask me.';
      return;
    }
    out.className = '';
    out.innerHTML = hits.slice(0, 12).map(function (p) {
      return '<div class="hit"><b>' + p.team + '</b><span>' + p.name
           + '<small>Team ' + p.team + '</small></span></div>';
    }).join('');
  }
  q.addEventListener('input', render);
})();
</script>
</body></html>
